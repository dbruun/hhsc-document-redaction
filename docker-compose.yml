version: '3.9'

services:
  backend:
    build:
      context: ./backend/DocumentRedaction.API
      dockerfile: Dockerfile
    ports:
      - '5000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Azure__Language__Endpoint=${AZURE_LANGUAGE_ENDPOINT:-https://derekgatewaytest.azure-api.net/multimodalsearch-resource}
      - Azure__Language__Key=${AZURE_LANGUAGE_KEY}
      - Azure__Storage__ConnectionString=${AZURE_STORAGE_CONNECTION_STRING}
      - Azure__Storage__ContainerName=${AZURE_STORAGE_CONTAINER_NAME:-documents}
      - AllowedOrigins__0=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
