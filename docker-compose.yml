version: '3.9'

services:
  backend:
    build:
      context: ./backend/DocumentRedaction.API
      dockerfile: Dockerfile
    ports:
      - '5000:8080'
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Azure__TenantId=${AZURE_TENANT_ID}
      - Azure__Language__Endpoint=${AZURE_LANGUAGE_ENDPOINT}
      - Azure__DocumentIntelligence__Endpoint=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
      - Azure__Storage__ServiceUri=${AZURE_STORAGE_SERVICE_URI}
      - Azure__Storage__UnredactedContainerName=${AZURE_STORAGE_UNREDACTED_CONTAINER_NAME:-documents-unredacted}
      - Azure__Storage__RedactedContainerName=${AZURE_STORAGE_REDACTED_CONTAINER_NAME:-documents-redacted}
      - AllowedOrigins__0=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
